name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Write local-only build configuration
        run: python3 scripts/write_ci_env.py

      - name: Install dependencies
        run: flutter pub get

      - name: Check changed Dart formatting
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_changed_dart_format.py

      - name: Translation and media inventory gates
        run: |
          make i18n-check
          python3 scripts/validate_exercise_videos.py
          python3 -m unittest discover -s scripts -p test_validate_exercise_videos.py

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build-android:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        flavor: [development, staging, production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Write local-only build configuration
        run: python3 scripts/write_ci_env.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (${{ matrix.flavor }})
        run: flutter build apk --flavor ${{ matrix.flavor }} -t lib/main_${{ matrix.flavor }}.dart --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          retention-days: 7

  build-ios:
    runs-on: macos-latest
    needs: test
    strategy:
      matrix:
        flavor: [development, staging, production]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: 'stable'
          cache: true

      - name: Write local-only build configuration
        run: python3 scripts/write_ci_env.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (${{ matrix.flavor }})
        run: flutter build ios --flavor ${{ matrix.flavor }} -t lib/main_${{ matrix.flavor }}.dart --release --no-codesign

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.flavor }}
          path: build/ios/iphoneos/
          retention-days: 7
