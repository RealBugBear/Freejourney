name: corejourney
description: Reflex Journey — Nervous System Training
publish_to: none
version: 1.0.5+2026081001

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Backend — Supabase
  supabase_flutter: ^2.5.0

  # Local database — Drift (SQLite)
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Firebase — FCM remote push notifications
  firebase_core: ^3.15.2
  firebase_messaging: ^15.0.0
  # Firebase — Analytics + Crashlytics (re-enable after core flow is stable)
  # firebase_analytics: ^11.0.1
  # firebase_crashlytics: ^4.0.3

  # Payments — RevenueCat (added back in Phase 18)
  # purchases_flutter: ^7.0.0

  # Video
  video_player: ^2.9.1
  cached_network_image: ^3.3.1
  # Video calls — Agora WebRTC
  agora_rtc_engine: ^6.3.2
  flutter_cache_manager: ^3.4.1

  # Audio + TTS + Haptics
  # flutter_tts: ^4.2.3  # DISABLED: crashes on iOS 26.2.1 (AVSpeechSynthesizer init in plugin registration)
  audioplayers: ^6.5.1
  wakelock_plus: ^1.3.3

  # Notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # Environment
  flutter_dotenv: ^5.0.2

  # Utilities
  google_fonts: ^6.1.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  intl: ^0.20.2
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.2
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  latlong2: ^0.9.1
  pdf: ^3.11.1
  share_plus: ^10.1.4
  logger: ^2.0.2+1
  cupertino_icons: ^1.0.8

  # Charts
  fl_chart: ^0.69.0

  # Calendar integration
  # device_calendar: ^4.3.2  # DISABLED: crashes on iOS 26.2.1 (EKEventStore init in plugin registration)
  url_launcher: ^6.2.5
  app_links: ^7.0.0
  sentry_flutter: ^8.14.2
  sign_in_with_apple: ^7.0.1
  google_sign_in: ^7.2.0

dependency_overrides:
  # device_calendar requires timezone ^0.9.0 but this project uses ^0.10.1.
  # TZDateTime.from API is compatible across both versions.
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.6
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env.dev
    - .env.prod
    # Images — one folder per reflex package
    - assets/images/brand/
    - assets/images/trainings/moro/
    - assets/images/trainings/spinal_galant/
    - assets/images/trainings/tlr/
    - assets/images/trainings/babkin/
    - assets/images/trainings/such_saug/
    - assets/images/trainings/atnr/
    - assets/images/trainings/stnr/
    - assets/images/trainings/babinski/
    - assets/images/trainings/landau/
    - assets/images/trainings/vorrunde/
    # Finalized exercise artwork (source-organized by reflex package)
    - assets/images/Bilder/00_Vorbereitung/
    - assets/images/Bilder/01_FLR und Moro-Reflex/
    - assets/images/Bilder/02_Spinaler Galant-Reflex/
    - assets/images/Bilder/03_TLR-Reflex/
    - assets/images/Bilder/04_ATNR-Reflex/
    - assets/images/Bilder/05_STNR-Reflex/
    - assets/images/Bilder/06_Babinski-Reflex/
    - assets/images/Bilder/07_Landau-Reflex/
    - assets/images/Bilder/08_Babkin-Plantar-Palmar-Aufricht-Reflex/
    - assets/images/Bilder/09_Such-Saug-Reflex/
    # Videos are streamed from Supabase Storage — NOT bundled
    # Sounds — shared + per package
    - assets/sounds/
    - assets/sounds/moro/
    - assets/sounds/spinal_galant/
    - assets/sounds/tlr/
    - assets/sounds/babkin/
    - assets/sounds/such_saug/
    - assets/sounds/atnr/
    - assets/sounds/stnr/
    - assets/sounds/babinski/
    - assets/sounds/landau/
    - assets/sounds/music/
    - assets/sounds/announcements/manifest.v1.json
    - assets/sounds/announcements/de/
    - assets/sounds/announcements/en/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/brand/origami_bird_mark.png"
